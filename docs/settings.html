<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactio settings</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="link.js"></script>
  <style>
    :root { --magenta: #BD31AD; --navy: #1F2A44; --muted: #5b6475; --err: #b3261e; --ok: #1e7b34; --line: #d9dce3; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif; color: var(--navy); background: #fff; font-size: 14px; }
    header { background: var(--magenta); color: #fff; padding: 14px 16px; }
    header h1 { margin: 0; font-size: 17px; font-weight: 600; }
    header p { margin: 4px 0 0; font-size: 12.5px; opacity: .9; }
    main { padding: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 4px; font-size: 14px; color: var(--navy); }
    input:focus { outline: 2px solid var(--magenta); outline-offset: -1px; border-color: var(--magenta); }
    .hint { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; word-break: break-all; }
    .msg { min-height: 20px; margin: 10px 0 0; font-size: 13px; }
    .msg.err { color: var(--err); } .msg.ok { color: var(--ok); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    button, a.btn { font: inherit; padding: 8px 14px; border-radius: 4px; border: 1px solid var(--line); background: #fff; color: var(--navy); cursor: pointer; text-decoration: none; }
    button.primary { background: var(--magenta); border-color: var(--magenta); color: #fff; font-weight: 600; }
    button:disabled { opacity: .5; cursor: default; }
    .current { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
    .current a { color: var(--magenta); word-break: break-all; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Interactio</h1>
    <p id="subtitle">Your personal Interactio meeting link</p>
  </header>
  <main>
    <form id="form" novalidate>
      <label for="link">Interactio meeting link</label>
      <input id="link" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="">
      <p class="hint">e.g. <span id="example"></span></p>
      <p id="msg" class="msg" role="status" aria-live="polite"></p>
      <div class="row">
        <button id="save" type="submit" class="primary">Save</button>
        <a id="open" class="btn" target="_blank" rel="noopener noreferrer" hidden>Open link</a>
        <button id="remove" type="button" hidden>Remove</button>
        <button id="cancel" type="button" hidden>Cancel</button>
      </div>
    </form>
    <div id="current" class="current" hidden>Saved link: <a id="currentLink" target="_blank" rel="noopener noreferrer"></a></div>
  </main>
  <script src="settings.js"></script>
</body>
</html>
